# Routing-Verbund für GSAK-NG (#442, Paketformat 2): EIN Valhalla-Bau über mehrere Länder, danach in Download-Teile zerlegt.
# Kacheln verschiedener Bauläufe passen nicht zusammen (Verweise über Kachelgrenzen); nur Teile desselben Baus lassen sich auf dem Gerät
# zusammensetzen – so gehen Routen über Landes- und Regionsgrenzen.
#   basis.zip      Ebenen 0 und 1 (Haupt- und Verbindungsstrassen) des ganzen Verbunds, valhalla.json, tzdata.tar – immer nötig
#   <gebiet>.zip   Ebene 2 (alle Wege) der Kacheln, die das Gebiet (Geofabrik-Polygon) berühren
# Nur von Hand («Run workflow»). Öffentliches Repository: Laufzeit kostenlos.
name: routing-verbund

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  verbund:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:3.9.0
      VALHALLA_MOBILE: "0.6.4"
      VERBUND: mitteleuropa
    steps:
      - uses: actions/checkout@v4

      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af >/dev/null
          df -h /
          free -g

      - name: Werkzeuge
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool jq zip python3-shapely
          docker pull "$VALHALLA_IMAGE"

      - name: OSM-Auszüge und Gebiete
        run: |
          mkdir -p work/pbf work/poly out
          # Auszüge für den Bau (ganze Länder) und Gebiete für die Download-Teile (Länder bzw. Regionen grosser Länder)
          for x in europe/switzerland europe/liechtenstein europe/austria europe/germany; do
            curl -fsSL -o "work/pbf/$(basename $x).osm.pbf" "https://download.geofabrik.de/${x}-latest.osm.pbf"
          done
          python3 verbund/gebiete.py --list | while IFS=$'\t' read -r id poly; do
            curl -fsSL -o "work/poly/$id.poly" "https://download.geofabrik.de/${poly}.poly"
          done
          OSM_DATE=$(for f in work/pbf/*.osm.pbf; do osmium fileinfo -g header.option.osmosis_replication_timestamp "$f" | cut -c1-10; done | sort | head -1)
          echo "OSM_DATE=$OSM_DATE" >> "$GITHUB_ENV"
          osmium merge -o work/verbund.osm.pbf work/pbf/*.osm.pbf
          rm -rf work/pbf
          BOX=$(osmium fileinfo -e -g data.bbox work/verbund.osm.pbf | tr -d '()' | tr ' ' ',')
          echo "BBOX=$BOX" >> "$GITHUB_ENV"
          echo "Stand $OSM_DATE, Bounding Box $BOX"
          ls -la work work/poly
          df -h /

      - name: Valhalla-Kacheln
        run: |
          cd work
          docker run --rm -v "$PWD:/data" -w /data "$VALHALLA_IMAGE" bash -c "
            set -e
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract '' \
              --additional-data-elevation /data/elevation > /data/valhalla.json
            valhalla_build_elevation -b '$BBOX' -c /data/valhalla.json -v
            valhalla_build_tiles -c /data/valhalla.json /data/verbund.osm.pbf
          "
          sudo chown -R "$USER" .
          rm -rf elevation verbund.osm.pbf
          du -sh tiles tiles/*
          df -h /

      - name: Teile
        run: |
          curl -fsSL -o work/tzdata.tar "https://raw.githubusercontent.com/Rallista/valhalla-mobile/${VALHALLA_MOBILE}/apple/Sources/Valhalla/SupportData/tzdata.tar"
          python3 verbund/teile.py --tiles work/tiles --poly work/poly --config work/valhalla.json --tzdata work/tzdata.tar \
            --out out --verbund "$VERBUND" --osm-date "$OSM_DATE" --bbox "$BBOX" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/routing-${VERBUND}-${OSM_DATE}"
          echo "TAG=routing-${VERBUND}-${OSM_DATE}" >> "$GITHUB_ENV"
          ls -la out

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Routing-Verbund **$VERBUND** für GSAK-NG (Paketformat 2, Valhalla 3.9.0), OSM-Stand $OSM_DATE."
            echo
            echo "\`basis.zip\` ist immer nötig; dazu die Gebiete (Länder bzw. Regionen). Routen über Grenzen gehen, wenn die berührten Gebiete geladen sind."
            echo
            echo "| Datei | Grösse |"
            echo "|---|---|"
            jq -r '.teile[] | "| \(.datei) | \(.groesse / 1048576 | floor) MB |"' out/verbund.json
            echo
            echo "Daten © OpenStreetMap-Mitwirkende, ODbL 1.0"
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/*.zip --title "Routing-Verbund $VERBUND ($OSM_DATE)" --notes-file notes.md

      - name: Katalog
        run: |
          git pull -q --rebase
          jq --slurpfile v out/verbund.json --arg now "$(date -u +%FT%TZ)" '.aktualisiert = $now | .verbund = $v[0]' katalog.json > katalog.neu
          mv katalog.neu katalog.json
          jq '.verbund | del(.teile[].kacheln)' katalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add katalog.json
          git commit -m "Katalog: Routing-Verbund $VERBUND ($OSM_DATE)"
          git push
